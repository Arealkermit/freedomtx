name: Build Tango 2 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - tango2-ghst

jobs:
  build-tango:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreedomTX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Tango 2 inside OpenTX toolchain
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/raphaelcoeffic/opentx-commit-tests \
            /bin/bash -lc '
              set -e

              rm -rf build-tango
              mkdir build-tango
              cd build-tango

              cmake \
                -DDISABLE_COMPANION=YES \
                -DCMAKE_BUILD_TYPE=Release \
                -DPCB=TANGO \
                -DHELI=YES \
                -DLUA=YES \
                -DGVARS=YES \
                -DCROSSFIRE=ON \
                ..

              make -j2 firmware
            '

      - name: Show firmware information
        run: |
          ls -lh build-tango/firmware.bin
          sha256sum build-tango/firmware.bin

      - name: Upload Tango 2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: tango2-stock-firmware
          path: build-tango/firmware.bin
          if-no-files-found: error