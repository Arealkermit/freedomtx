name: Build Tango 2 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - tango2-ghst

jobs:
  build-tango:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreedomTX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Tango 2 inside OpenTX toolchain
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/raphaelcoeffic/opentx-commit-tests \
            /bin/bash -lc '
              set -e

              rm -rf build-tango
              mkdir build-tango
              cd build-tango

              cmake \
                -DDISABLE_COMPANION=YES \
                -DCMAKE_BUILD_TYPE=Release \
                -DPCB=TANGO \
                -DHELI=YES \
                -DLUA=YES \
                -DGVARS=YES \
                -DCROSSFIRE=ON \
                ..

              make -j2 firmware
              echo "===== VERIFY GHOST CMAKE OPTION ====="
              grep "^GHOST:" CMakeCache.txt || true

              echo "===== VERIFY -DGHOST COMPILER FLAG ====="
              grep -R --include="flags.make" -- "-DGHOST" . | head -20 || true

              echo "===== GHOST OBJECT FILES ====="
              find . -type f -iname "*ghost*.o" -print

              echo "===== GHOST OBJECT SYMBOLS ====="
              find . -type f -iname "*ghost*.o" | while read obj; do
                echo "--- $obj ---"
                arm-none-eabi-nm -C "$obj" | grep -Ei "ghost|ghst" || true
              done

              echo "===== LINKED ELF FILES ====="
              find . -type f -name "*.elf" -print

              ELF=$(find . -type f -name "*.elf" | head -n 1)

              if [ -n "$ELF" ]; then
                echo "===== GHOST SYMBOLS IN FINAL ELF ====="
                arm-none-eabi-nm -C "$ELF" | grep -E \
                  "setupPulsesGhost|createGhostChannelsFrame|processGhostTelemetryFrame|getGhostModuleAddr" \
                  || true
              else
                echo "No ELF file found"
              fi
            '

      - name: Show firmware information
        run: |
          ls -lh build-tango/firmware.bin
          sha256sum build-tango/firmware.bin

      - name: Upload Tango 2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: tango2-ghst-firmware
          path: build-tango/firmware.bin
          if-no-files-found: error